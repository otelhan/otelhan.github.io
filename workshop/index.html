<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Personas — Designer • Farmer • CSO</title>
    <style>
      :root {
        --bg-dark: #0e1117;
        --ink: #e6e6e6;
        --muted: #b8c1cc;
        --brand: #6ee7ff;
        --nav-bg: rgba(14, 17, 23, 0.7);
        --overlay: rgba(0, 0, 0, 0.45);
        --maxw: 1120px;
      }
      html, body { height: 100%; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--ink);
        background: var(--bg-dark);
      }
      .nav {
        position: sticky; top: 0; z-index: 50;
        display: flex; gap: 10px; align-items: center; justify-content: center;
        padding: 12px 16px; background: var(--nav-bg); backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .nav a {
        color: var(--ink); text-decoration: none; padding: 8px 14px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
      }
      .nav a:hover, .nav a.active { border-color: var(--brand); color: var(--brand); }

      .section {
        position: relative; min-height: 100vh; display: grid; align-items: center;
        padding: 80px 20px; isolation: isolate;
      }
      .section .bg { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat; }
      .section .overlay { position: absolute; inset: 0; z-index: -1; background: var(--overlay); }

      .container { max-width: var(--maxw); margin: 0 auto; }
      h1, h2 { margin: 0 0 10px 0; letter-spacing: 0.2px; }
      p.lead { margin: 0 0 20px 0; color: var(--muted); max-width: 70ch; }

      .iframe-wrap {
        position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px; overflow: hidden; background: rgba(0,0,0,0.25);
      }
      .iframe-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

      .spacer { height: 22px; }

      @media (max-width: 720px) {
        .section { padding: 72px 14px; }
        p.lead { max-width: none; }
      }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="Personas">
      <a href="#designer" id="tab-designer">Designer</a>
      <a href="#farmer" id="tab-farmer">Farmer</a>
      <a href="#cso" id="tab-cso">CSO</a>
    </nav>

    <!-- Designer Section: set a background image by editing the inline style below -->
    <section id="designer" class="section">
      <div class="bg" style="background-image: url('assets/designer_bg.jpg');"></div>
      <div class="overlay"></div>
      <div class="container">
        <h2>AI Designer</h2>
        <p class="lead">Balance performance, sustainability, and aesthetics. Ask better questions, review evidence, and visualize trade‑offs.</p>
        <div class="spacer"></div>
        <div class="iframe-wrap">
          <!-- Replace src with your hosted chat (e.g., Flowise/Retool/Dify). Example: https://... -->
         <iframe
         title="Designer Chat"
         src="https://udify.app/chatbot/Oy5nZMxV2BbFuBLL"
         style="width: 100%; height: 100%; min-height: 700px"
         allow="clipboard-write; fullscreen;" 
         frameborder="0"
        </iframe>
        </div>
      </div>
    </section>

    <!-- Farmer Section -->
    <section id="farmer" class="section">
      <div class="bg" style="background-image: url('assets/farmer_bg.jpg');"></div>
      <div class="overlay"></div>
      <div class="container">
        <h2>AI Farmer</h2>
        <p class="lead">Optimize yield, quality, and cycle time. Surface SOP parameters, identify bottlenecks, and propose safe adjustments.</p>
        <div class="spacer"></div>
        <div class="iframe-wrap">
          <iframe title="Farmer Chat" src="" allow="clipboard-write; fullscreen;" loading="lazy"></iframe>
        </div>
      </div>
    </section>

    <!-- CSO Section -->
    <section id="cso" class="section">
      <div class="bg" style="background-image: url('assets/cso_bg.jpg');"></div>
      <div class="overlay"></div>
      <div class="container">
        <h2>AI CSO</h2>
        <p class="lead">Drive scientific readiness: validation plans, comparators, and transfer criteria. Tie evidence to decisions.</p>
        <div class="spacer"></div>
        <div class="iframe-wrap">
          <iframe title="CSO Chat" src="" allow="clipboard-write; fullscreen;" loading="lazy"></iframe>
        </div>
      </div>
    </section>

    <script>
      // Highlight active tab on scroll
      const sections = [
        { id: 'designer', el: document.getElementById('designer'), tab: document.getElementById('tab-designer') },
        { id: 'farmer', el: document.getElementById('farmer'), tab: document.getElementById('tab-farmer') },
        { id: 'cso', el: document.getElementById('cso'), tab: document.getElementById('tab-cso') },
      ];
      const onScroll = () => {
        const y = window.scrollY + 100; // offset for sticky nav
        let current = sections[0];
        for (const s of sections) {
          if (s.el.offsetTop <= y) current = s;
        }
        sections.forEach(s => s.tab.classList.toggle('active', s === current));
      };
      document.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    </script>
  </body>
  </html>
